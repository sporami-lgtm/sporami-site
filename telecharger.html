<style>
  :root { --bg: #030720; --ink: #F3F6FF; --muted: #A9B6E8; --gold: #FFC266; --gold2: #FFE3A3; --gold3: #E58E2B; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; }
  body { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    background: radial-gradient(ellipse at 50% 30%, rgba(40, 100, 255, .35), transparent 60%), var(--bg); }
  main { text-align: center; max-width: 420px; }
  img { width: 128px; height: 128px; border-radius: 28px; box-shadow: 0 18px 50px -12px rgba(40, 100, 255, .8); }
  h1 { font-size: 30px; margin: 22px 0 6px; letter-spacing: -.5px; }
  p { color: var(--muted); font-size: 16px; line-height: 1.5; margin: 0 0 26px; }
  a.btn { display: inline-block; padding: 16px 28px; border-radius: 999px; font-weight: 700; font-size: 17px;
    color: #1B1203; text-decoration: none; background: linear-gradient(135deg, var(--gold2), var(--gold) 50%, var(--gold3)); }
  a.home { display: block; margin-top: 18px; color: var(--muted); font-size: 14px; }
</style>

<main>

</main>
