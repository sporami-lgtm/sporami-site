<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Événement sur SPORAMI</title>
<meta name="description" content="Inscris-toi à cet événement sportif sur SPORAMI.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#040A26">
<script>
// Bandeau de l'App Store : « Ouvrir » renvoie ce lien à SPORAMI, qui ouvre l'événement
(function () {
  var e = (new URLSearchParams(location.search).get("e") || "").toUpperCase().replace(/[^A-F0-9-]/g, "").slice(0, 36);
  document.write('<meta name="apple-itunes-app" content="app-id=6819085786, app-argument=https://sporami.app/evenement?e=' + e + '">');
})();
</script>
<meta property="og:type" content="website">
<meta property="og:site_name" content="SPORAMI">
<meta property="og:title" content="Inscris-toi sur SPORAMI">
<meta property="og:description" content="Un événement sportif t'attend. Touche le lien pour l'ouvrir dans l'appli et t'inscrire.">
<meta property="og:image" content="https://sporami.app/icon.png">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">
<meta name="twitter:card" content="summary">
<link rel="icon" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
@font-face{font-family:"Big Shoulders";src:url("/big-shoulders-700.woff") format("woff");font-weight:700;font-display:swap}
@font-face{font-family:"Instrument Sans";src:url("/instrument-sans-400.woff") format("woff");font-weight:400;font-display:swap}
@font-face{font-family:"Instrument Sans";src:url("/instrument-sans-700.woff") format("woff");font-weight:700;font-display:swap}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#040A26;color:#F3F6FF;font-family:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;display:grid;place-items:center;padding:24px 20px}
main{max-width:420px;text-align:center}
img{display:block;width:120px;height:120px;margin:0 auto;border-radius:27px;box-shadow:0 0 0 1px rgba(160,190,255,.22),0 24px 48px -20px rgba(0,0,0,.85)}
h1{margin:26px 0 8px;font:700 64px/.9 "Big Shoulders","Arial Narrow",sans-serif;letter-spacing:.04em}
p{margin:0 0 28px;color:#AAB6DD;font-size:17px;line-height:1.5}
a.btn{display:inline-block;padding:16px 28px;border-radius:999px;font-weight:700;font-size:17px;color:#1B1203;text-decoration:none;background:linear-gradient(135deg,#FFE3A3,#FFC266 50%,#E58E2B)}
a.home{display:block;margin-top:20px;color:#AAB6DD;font-size:15px}
a:focus-visible{outline:2px solid #FFC266;outline-offset:3px}
.how{margin:22px 0 0;font-size:15px}
.how b{color:#F3F6FF}
</style>
</head>
<body>
<main>
  <img src="/icon.png" alt="Logo SPORAMI" width="120" height="120">
  <h1>SPORAMI</h1>
  <p>Un événement sportif t’attend : les inscriptions se font dans l’appli.<br>Si SPORAMI est installé, le lien s’ouvre directement sur l’événement.</p>
  <a class="btn" href="https://apps.apple.com/fr/app/sporami/id6819085786">Télécharger SPORAMI</a>
  <p class="how">Une fois l’appli installée, <b>touche à nouveau ce lien</b> (ou scanne le QR code) pour t’inscrire.</p>
  <a class="home" href="/">Découvrir SPORAMI</a>
</main>
</body>
</html>
